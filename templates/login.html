<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMS Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="login-page"><div class="login-card"><div class="login-logo">✚</div><div class="eyebrow">HOSPITAL MANAGEMENT SYSTEM</div><h1>Admin Login</h1><p>Secure access to the hospital management dashboard.</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash error">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>Username</label><input name="username" value="admin" required><label>Password</label><input type="password" name="password" placeholder="Enter password" required><button class="primary full">Login to HMS</button></form><small>Demo login: admin / admin123</small></div></body></html>
